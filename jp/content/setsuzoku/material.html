<html lang="zh">
<head>
<meta charset="utf-8">

<title>日语接续表达一览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2EF; --card:#FBFCFA; --ink:#1C2A30; --sub:#5B6B70; --rule:#CFD8D3; --rule-soft:#E4EAE6;
  --ai:#27466F; --ai-soft:#DCE5F0; --shu:#C23B2A; --shu-soft:#F6DED9; --midori:#2C7652; --midori-soft:#D9ECE1;
  --kin:#9A6A1B; --kin-soft:#F5E9CF; --head:#1E3A5F;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#151C1F; --card:#1D262A; --ink:#E4EAE7; --sub:#98A7A3; --rule:#33413F; --rule-soft:#26312F;
  --ai:#8FB0DC; --ai-soft:#24344A; --shu:#E9776A; --shu-soft:#452521; --midori:#6FC39A; --midori-soft:#1F3A2C;
  --kin:#E0B35C; --kin-soft:#3D2F14; --head:#24344A;
}}
:root[data-theme="dark"]{
  --paper:#151C1F; --card:#1D262A; --ink:#E4EAE7; --sub:#98A7A3; --rule:#33413F; --rule-soft:#26312F;
  --ai:#8FB0DC; --ai-soft:#24344A; --shu:#E9776A; --shu-soft:#452521; --midori:#6FC39A; --midori-soft:#1F3A2C;
  --kin:#E0B35C; --kin-soft:#3D2F14; --head:#24344A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif;font-size:14.5px;line-height:1.6}
[lang=ja],.ja{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:26px 18px 60px}
header h1{margin:0 0 8px;font-size:27px;line-height:1.2;letter-spacing:.02em}
header p{margin:0 0 8px;color:var(--sub);font-size:13.5px;max-width:80ch}
header p b{color:var(--ink);font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:8px;align-items:center}
.reg{display:inline-block;font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;font-weight:700;font-family:"Zen Kaku Gothic New",sans-serif;vertical-align:1px;margin-right:2px}
.reg.k{background:var(--shu-soft);color:var(--shu)}     /* 口 */
.reg.s{background:var(--ai-soft);color:var(--ai)}       /* 書 */
.reg.g{background:var(--kin-soft);color:var(--kin)}     /* 公 */
.reg.o{background:var(--rule-soft);color:var(--sub)}    /* 其他 */

.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px 0 10px;margin:14px -18px 10px;padding-left:18px;padding-right:18px;border-bottom:1px solid var(--rule)}
.bar .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px}
.bar .cnt{font-size:12.5px;color:var(--sub);white-space:nowrap;min-width:5em}
.bar label{font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.bar .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.bar .chips a{font-size:12px;color:var(--ink);border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:3px 10px;text-decoration:none;white-space:nowrap}
.bar .chips a:hover{border-color:var(--ai);color:var(--ai)}
.bar .chips a.cur{background:var(--ai);border-color:var(--ai);color:var(--card)}

section{margin-top:26px;scroll-margin-top:120px}
section h2{margin:0;background:var(--head);color:#fff;font-size:16px;font-weight:600;padding:9px 14px;border-radius:8px 8px 0 0;display:flex;align-items:baseline;gap:10px}
section h2 small{font-weight:400;font-size:12.5px;opacity:.75;margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
th{font-size:12px;color:var(--sub);font-weight:500;text-align:left;padding:7px 10px;background:var(--ai-soft);border-bottom:1px solid var(--rule)}
td{padding:9px 10px;vertical-align:top;border-bottom:1px solid var(--rule-soft);font-size:14px}
tr:last-child td{border-bottom:0}
tr:nth-child(even) td{background:color-mix(in srgb,var(--paper) 45%,var(--card))}
td.n{color:var(--sub);font-size:12px;width:2.2em;text-align:right;padding-right:6px;font-variant-numeric:tabular-nums}
td.e{font-weight:700;font-size:15px;width:11em;font-family:"Zen Kaku Gothic New",sans-serif}
td.t{color:var(--sub);font-size:12.5px;width:6.5em}
td.u{width:16em}
td.x .ja{display:block;font-size:14.5px}
td.x .zh{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
body.hide-zh td.x .zh{filter:blur(5px);transition:filter .15s}
body.hide-zh td.x .zh:hover{filter:none}
tr.hit td{background:var(--kin-soft)!important}
tr.off{display:none}
section.off{display:none}
mark{background:var(--kin-soft);color:inherit;padding:0 1px;border-radius:2px}
.note{margin-top:28px;border-left:3px solid var(--ai);background:var(--ai-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13px}
.none{margin-top:26px;padding:24px;text-align:center;color:var(--sub);border:1px dashed var(--rule);border-radius:8px}
.foot{margin-top:24px;font-size:12px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
@media (max-width:700px){
  th{display:none}
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:2.2em 1fr;gap:2px 8px;padding:10px 10px;border-bottom:1px solid var(--rule-soft)}
  tr:nth-child(even){background:color-mix(in srgb,var(--paper) 45%,var(--card))}
  tr:nth-child(even) td{background:transparent}
  td{display:block;padding:0;border:0;width:auto!important;font-size:14px}
  td.n{grid-row:1/span 4;padding-top:2px}
  td.e{font-size:16px}
  td.t{margin-top:-2px}
  td.u{margin-top:4px}
  td.x{margin-top:6px}
}
@media print{
  .bar{display:none}
  body{background:#fff;color:#000}
  section{break-inside:avoid}
  td.x .zh{filter:none!important}
}
</style>
</head>

<div class="wrap">
<header>
  <h1>日语接续表达一览</h1>
  <p>三个层级：<b>接続詞</b>（句首独立词，连接两个句子，如 しかし）、<b>接続助詞</b>（接在谓语后，把两个分句连成一句，如 ～が、～ので）、<b>並立助詞／句型</b>（连接词语或固定复合表达，如 と、～にもかかわらず）。各表内按常用频率由高到低排列。</p>
  <div class="legend">语体标记：<span><span class="reg k">口</span>口语</span><span><span class="reg s">書</span>书面</span><span><span class="reg g">公</span>公文・法律</span></div>
</header>

<div class="bar">
  <div class="row">
    <input type="search" id="q" placeholder="搜索表达・用法・例句（日文或中文）" aria-label="搜索">
    <span class="cnt" id="cnt"></span>
    <label><input type="checkbox" id="hz"> 遮住中文译文</label>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div id="body"></div>
<div class="none" id="none" hidden>没有匹配的条目</div>

<div class="note">频率排序为综合语料库总体倾向的大致排序，口语与书面差别很大：口语中 でも／けど／から／たら 占压倒性多数；书面与公文中 が／しかし／ため／および／したがって 更多。</div>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const REG={"口":"k","書":"s","公":"g"};
const regHTML=r=>r.map(x=>`<span class="reg ${REG[x]||"o"}">${esc(x)}</span>`).join("");
const ZH=["一","二","三","四","五","六","七","八","九","十"];

// render once
let total=0;
$("body").innerHTML=SECTIONS.map((s,si)=>{
  const [zh,ja,rows]=s;total+=rows.length;
  return `<section id="s${si+1}"><h2>${esc(zh)}<span class="ja" lang="ja" style="font-weight:400;opacity:.85">（${esc(ja)}）</span><small>${rows.length} 条</small></h2>
  <table><thead><tr><th>#</th><th>表达</th><th>类型</th><th>用法・语感</th><th>例句</th></tr></thead><tbody>${rows.map((r,i)=>{
    const [e,t,reg,u,jp,cn]=r;
    return `<tr data-s="${si}" data-i="${i}"><td class="n">${i+1}</td><td class="e" lang="ja" data-f>${esc(e)}</td><td class="t">${esc(t)}</td><td class="u" data-f>${regHTML(reg)}${esc(u)}</td><td class="x"><span class="ja" lang="ja" data-f>${esc(jp)}</span><span class="zh" data-f>${esc(cn)}</span></td></tr>`}).join("")}</tbody></table></section>`}).join("");
$("total").textContent=total;
$("chips").innerHTML=SECTIONS.map((s,i)=>`<a href="#s${i+1}" data-s="${i}">${ZH[i]} ${esc(s[0].replace(/^.+、/,""))}</a>`).join("");

// search
const rows=[...document.querySelectorAll("tbody tr")];
const secs=[...document.querySelectorAll("section")];
const texts=rows.map(tr=>tr.textContent.toLowerCase());
const orig=rows.map(tr=>[...tr.querySelectorAll("[data-f]")].map(el=>el.innerHTML));
function search(q){
  q=q.trim().toLowerCase();
  let n=0;const alive=new Set();
  rows.forEach((tr,k)=>{
    const els=tr.querySelectorAll("[data-f]");
    if(!q){tr.classList.remove("off","hit");els.forEach((el,j)=>el.innerHTML=orig[k][j]);alive.add(tr.dataset.s);n++;return}
    const hit=texts[k].includes(q);
    tr.classList.toggle("off",!hit);tr.classList.toggle("hit",hit);
    if(hit){n++;alive.add(tr.dataset.s);
      els.forEach((el,j)=>{const html=orig[k][j];
        // highlight in text nodes only (skip tags)
        el.innerHTML=html.replace(/>([^<]+)</g,(m,txt)=>">"+txt.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),x=>`<mark>${x}</mark>`)+"<").replace(/^([^<]+)/,txt=>txt.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),x=>`<mark>${x}</mark>`))});
    }else els.forEach((el,j)=>el.innerHTML=orig[k][j]);
  });
  secs.forEach((s,i)=>s.classList.toggle("off",!!q&&!alive.has(String(i))));
  $("cnt").textContent=q?`${n} / ${total} 条`:"";
  $("none").hidden=n>0;
}
$("q").addEventListener("input",e=>search(e.target.value));
$("hz").addEventListener("change",e=>{document.body.classList.toggle("hide-zh",e.target.checked);try{localStorage.setItem("jp-setsuzoku-hidezh",e.target.checked?"1":"")}catch(_){}});
try{if(localStorage.getItem("jp-setsuzoku-hidezh")){$("hz").checked=true;document.body.classList.add("hide-zh")}}catch(_){}

// current-section chip
const chips=[...document.querySelectorAll("#chips a")];
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const i=secs.indexOf(en.target);chips.forEach((c,k)=>c.classList.toggle("cur",k===i))}})},{rootMargin:"-120px 0px -70% 0px"});
secs.forEach(s=>io.observe(s));
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus()}});

/* deep link from the site search: ?q=ただし prefills and runs the in-page search */
(function(){try{
  const q=new URLSearchParams(location.search).get("q");
  if(!q)return;
  $("q").value=q;search(q);
  document.documentElement.dataset.jpq="1";   // tells the viewer not to re-find it
  const first=document.querySelector("tr.hit");
  if(first)requestAnimationFrame(()=>first.scrollIntoView({block:"center"}));
}catch(e){}})();
</script>
</body>
