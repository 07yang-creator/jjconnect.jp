<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五段動詞一覧（頻度順）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2EF;--card:#FBFCFA;--ink:#1C2A30;--sub:#5B6B70;--rule:#CFD8D3;
  --ai:#27466F;--ai-soft:#DCE5F0;--shu:#C23B2A;--shu-soft:#F6DED9;--midori:#2C7652;--midori-soft:#D9ECE1;--murasaki:#6B5CA0;--cha:#8A6A3A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151C1F;--card:#1D262A;--ink:#E4EAE7;--sub:#98A7A3;--rule:#33413F;
  --ai:#8FB0DC;--ai-soft:#24344A;--shu:#E9776A;--shu-soft:#452521;--midori:#6FC39A;--midori-soft:#1F3A2C;--murasaki:#B3A6E6;--cha:#D9B077}}
:root[data-theme="dark"]{--paper:#151C1F;--card:#1D262A;--ink:#E4EAE7;--sub:#98A7A3;--rule:#33413F;
  --ai:#8FB0DC;--ai-soft:#24344A;--shu:#E9776A;--shu-soft:#452521;--midori:#6FC39A;--midori-soft:#1F3A2C;--murasaki:#B3A6E6;--cha:#D9B077}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.65}
[lang=ja],.ja{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:26px 18px 64px;display:grid;grid-template-columns:210px 1fr;gap:34px;align-items:start}
.hero{grid-column:1/-1;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:4px}
h1{margin:0;font-size:30px;letter-spacing:.02em}
.hero p{margin:8px 0 0;color:var(--sub);font-size:14px;max-width:62ch}
.hero .lk{margin-top:12px;font-size:13px}
.hero a{color:var(--ai)}
nav{position:sticky;top:12px;font-size:13px}
nav .nt{font-size:12px;color:var(--sub);letter-spacing:.14em;margin:14px 0 8px;padding-left:9px;border-top:1px solid var(--rule);padding-top:12px}
nav .nt:first-child{margin-top:0;border-top:0;padding-top:0}
.partbar{grid-column:1/-1;font-size:13px;letter-spacing:.2em;color:var(--sub);margin:18px 0 -8px}
nav a{display:block;padding:5px 9px;border-radius:6px;color:var(--ink);text-decoration:none;border-left:2px solid transparent}
nav a:hover{background:var(--ai-soft)}
nav a.on{border-left-color:var(--ai);background:var(--ai-soft);color:var(--ai);font-weight:500}
nav a .c{color:var(--sub);font-size:11px;margin-right:6px}
main{min-width:0}
section{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:24px;margin-bottom:22px;scroll-margin-top:80px}
.cat{display:inline-block;font-size:11px;letter-spacing:.1em;color:var(--card);background:var(--ai);padding:2px 9px;border-radius:999px;vertical-align:middle}
h2{margin:10px 0 6px;font-size:23px;line-height:1.35}
.lead{margin:0 0 16px;color:var(--sub);font-size:14px}
table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14px}
th{text-align:left;background:var(--ai-soft);color:var(--ai);padding:7px 10px;font-weight:700;font-size:13px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;white-space:nowrap;font-family:"Zen Kaku Gothic New",sans-serif}
.ex{display:grid;gap:10px}
.e{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 12px;border-radius:8px;align-items:start}
.e.o{background:var(--midori-soft)}.e.x{background:var(--shu-soft)}
.e .m{font-size:17px;font-weight:700;line-height:1.3;text-align:center}
.e.o .m{color:var(--midori)}.e.x .m{color:var(--shu)}
.e .s{font-size:17px;line-height:1.55}
.e .n{font-size:13px;color:var(--sub);margin-top:3px}
.tip{margin-top:16px;padding:11px 14px;border-left:3px solid var(--ai);background:var(--ai-soft);border-radius:0 6px 6px 0;font-size:14px}
.tip b{color:var(--ai)}
/* 活用表・自他表 */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ai);border-color:var(--ai);color:var(--card)}
.filters input{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);min-width:220px}
.filters input:focus{outline:2px solid var(--ai);outline-offset:1px}
.cnt{font-size:12px;color:var(--sub);margin-left:auto}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{white-space:nowrap;margin-bottom:6px}
.tw td,.tw th{font-size:13px;padding:6px 9px}
.tw td.ja{font-family:"Zen Kaku Gothic New",sans-serif}
.tw td:first-child{font-weight:400;font-family:inherit}
.tw td.hw{font-weight:700}
.vgnav{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px;font-size:12px}
.vgnav a{color:var(--ai);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.vgnav a:hover{background:var(--ai-soft)}
h3.vg{margin:18px 0 6px;font-size:16px;display:flex;align-items:baseline;gap:10px;scroll-margin-top:80px}
h3.vg small{font-size:12px;color:var(--sub);font-weight:400}
h3.vg:first-child{margin-top:4px}
.yomi{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.yomi.imi{font-family:"Noto Sans SC",sans-serif;color:var(--ai)}
.k{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--sub);white-space:nowrap}
.k.g5{border-color:var(--ai);color:var(--ai)}.k.g1{border-color:var(--midori);color:var(--midori)}.k.gs{border-color:var(--shu);color:var(--shu)}
.ty{display:inline-block;width:1.7em;text-align:center;border-radius:4px;font-size:12px;font-weight:700;color:var(--card)}
.ty.t1{background:var(--midori)}.ty.t2{background:var(--ai)}.ty.t3{background:#6B5CA0}.ty.t4{background:var(--shu)}
.legend{font-size:12px;color:var(--sub);margin:-6px 0 12px}
/* 着色＝与辞書形不同的部分：仮定 緑・可能 青・受身 朱・使役 紫・其他 茶 */
.f{font-weight:700}.f.hk{color:var(--cha)}.f.kt{color:var(--midori)}.f.kn{color:var(--ai)}.f.uk{color:var(--shu)}.f.sk,.f.su{color:var(--murasaki)}
.legend .f{margin:0 1px}
.tw th{text-align:center}
/* 段与段之间的竖线；五段块与一段块之间的横线 */
.tw td.gs,.tw th.gs{border-left:2px solid var(--rule)}.tw td.gs,.tw th.gs{border-left:2px solid color-mix(in srgb,var(--sub) 45%,transparent)}
.tw tr.cb>td{border-top:2px solid var(--rule)}.tw tr.cb>td{border-top:2px solid color-mix(in srgb,var(--sub) 45%,transparent)}.tw th small.dan{display:block;font-weight:400;font-size:10px;color:var(--sub)}.legend a{color:var(--ai)}
/* 活用表：五段行浅色底，一段・特殊无底色 */
.tw tr.g5>td{background:var(--ai-soft)}.tw tr.g5>td{background:color-mix(in srgb,var(--ai-soft) 55%,var(--card))}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid var(--rule);background:var(--ai-soft);background:color-mix(in srgb,var(--ai-soft) 55%,var(--card))}
.legend .ty{margin-right:2px}
td.note{white-space:normal;min-width:16em;color:var(--sub);font-size:12px}
mark{background:var(--ai-soft);color:inherit;padding:0 2px;border-radius:2px}
footer{grid-column:1/-1;margin-top:10px;padding-top:16px;border-top:1px solid var(--rule);color:var(--sub);font-size:13px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer a{color:var(--ai)}
.top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;display:none;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top.show{display:block}
@media (max-width:900px){
  .partbar{margin:10px 0 0}
  .wrap{grid-template-columns:1fr;gap:16px;padding:20px 14px 56px}
  nav{position:static;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  nav .nt{display:none}
  nav a{white-space:nowrap;border:1px solid var(--rule);border-left:1px solid var(--rule);border-radius:999px;padding:6px 13px}
  nav a.on{border-color:var(--ai)}
  nav a .c{display:none}
  h1{font-size:24px}h2{font-size:20px}section{padding:18px 15px}
  table{display:block;overflow-x:auto;white-space:nowrap}
  td:not(:first-child){white-space:normal;min-width:11em}
  .tw table{display:table}
  .filters input{min-width:0;flex:1}
}

/* 五段一覧 */
.wrap{grid-template-columns:1fr;max-width:980px}
.filters{margin:14px 0 8px}
.filters label{font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.meta{font-size:12px;color:var(--sub);margin:0 0 10px}
.note2{font-size:12px;color:var(--ai);margin:0 0 8px;min-height:1.2em}
table.g{font-size:14px}
table.g td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.g td.hw{font-weight:700;white-space:nowrap}
table.g tr.ie td{background:color-mix(in srgb,var(--shu-soft) 55%,var(--card))}
table.g td.note{white-space:normal;min-width:12em}
table.g td.more{text-align:center;color:var(--sub)}
.k{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--ai);color:var(--ai);white-space:nowrap}
@media (max-width:900px){table.g{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>五段動詞一覧（頻度順）</h1>
    <p>把国立国語研究所的 BCCWJ 語彙表（约 1 亿词的书面语料）里的全部动词按 UniDic 的活用型分类，只留五段，按频度排。默认只显示頻度 1000 以上的常用词；可按行筛选、只看「像一段的五段」、或检索辞書形・読み。浅红底的行是 い・え段＋る 的五段，就是見分け方里要背的那批。</p>
    <p class="lk"><a href="/v/doushi/material.html" target="_top">← 动词讲义</a>　|　<a href="/v/doushi/drill1.html" target="_top">活用ドリル①</a></p>
  </div>
  <main>
    <p class="meta" id="meta"></p>
    <div class="filters"><div class="chips" id="gyo"></div></div>
    <div class="filters"><div class="chips" id="th"></div><label><input type="checkbox" id="ie"> 只看 い・え段＋る 的五段</label>
      <input id="q" type="search" placeholder="検索：辞書形・読み" aria-label="检索"><span class="cnt" id="cnt"></span></div>
    <p class="note2" id="note"></p>
    <div class="tw"><table class="g"><thead><tr><th>順位</th><th>辞書形</th><th>行</th><th>頻度</th><th>pmw</th><th>備考</th></tr></thead><tbody id="tb"></tbody></table></div>
  </main>
  <footer><span>五段動詞一覧 · BCCWJ 語彙表 ver1.0 ＋ UniDic</span><span>株式会社JJconnect</span></footer>
</div>
